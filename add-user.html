<!DOCTYPE html>
<html>
<head>
  <title>Add User</title>

  <link rel="stylesheet" href="index.css">
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/darkly/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div id="serverWarning" style="display:none; padding:20px; background:#ffdddd; color:#900; text-align:center;">
  This page appears to be opened directly from the file system. Start the server and open the app via <a id="serverLinkAdd" href="#">http://localhost:5000/add-user.html</a> to use the app.
</div>

<script>
  if (window.location.protocol === 'file:') {
    const link = document.getElementById('serverLinkAdd');
    link.href = 'http://localhost:5000/add-user.html';
    document.getElementById('serverWarning').style.display = 'block';
  }
</script>

<div class="container mt-5">
  <h2>Add User</h2>

  <form id="addUserForm">
    <div class="d-flex justify-content-between mb-3">
      <a href="http://localhost:5000/index.html" class="btn btn-secondary">Back to list</a>
      <button class="btn btn-success">Save</button>
    </div>

    <input class="form-control mb-2" id="inputName" placeholder="Name">
    <input class="form-control mb-2" id="inputAge" type="number" placeholder="Age">
    <input class="form-control mb-2" id="inputHeight" type="number" placeholder="Height (cm)">
    <input class="form-control mb-2" id="inputWeight" type="number" placeholder="Weight (kg)">

    <select class="form-control mb-2" id="inputGender">
      <option value="">Gender</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select>

    <select class="form-control mb-3" id="inputActivity">
      <option value="">Activity</option>
      <option value="low">Low</option>
      <option value="moderate">Moderate</option>
      <option value="high">High</option>
    </select>
  </form>
</div>

<script src="add-user.js"></script>
<div id="imageModal" class="modal">
  <div class="modal-content">
    <h2>User Saved !</h2>
    <img id="modalImage" src="" />
    <button id="closeModal">Close</button>
  </div>
</div>
</body>
</html>
