<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Health Tracker</title>

  <link rel="stylesheet" href="index.css">

  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/darkly/bootstrap.min.css" rel="stylesheet">
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<!-- Warning shown when the page is opened via file:// instead of the running server -->
<div id="serverWarning" style="display:none; padding:20px; background:#ffdddd; color:#900; text-align:center;">
  This page appears to be opened directly from the file system. Start the server and open the app via <a id="serverLink" href="#">http://localhost:5000/index.html</a> to use the app.
</div>

<script>
  if (window.location.protocol === 'file:') {
    const link = document.getElementById('serverLink');
    link.href = 'http://localhost:5000/index.html';
    document.getElementById('serverWarning').style.display = 'block';
  }
</script>

<div class="app-container container mt-4">
  <h1 class="app-title text-center">Health Tracker</h1>

  <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search users...">

  <div class="text-end mb-3">
    <a href="add-user.html" class="btn btn-primary">Add User</a>
  </div>

  <table class="table table-bordered text-center">
    <thead class="table-dark">
      <tr>
        <th>Meme</th>
        <th>Name</th>
        <th>Age</th>
        <th>Height</th>
        <th>Weight</th>
        <th>BMI</th>
        <th>Status</th>
        <th>Calories</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody id="userTableBody"></tbody>
  </table>
</div>

<script src="index.js"></script>
</body>
</html>
